name: Build App

# Builds, validates, and (on push to main) deploys the React app (`app/`) to
# GitHub Pages.
#
# Trigger behavior:
#   - pull_request touching app/**  → install, lint, build (validates compile)
#   - push to main touching app/**  → build + deploy the React build artifact
#
# Production cutover (2026-05-30): GitHub Pages now serves the React build at
# https://benjaminwittes.github.io/ragtime/ instead of the legacy single-file
# index.html. This requires the repo's Pages "Source" to be set to
# "GitHub Actions" (Settings → Pages) — a one-time manual toggle.
#
# Custom-domain cutover (2026-06-02): the app now serves at origin root on
# https://ragtime.lawfaremedia.org. The build step sets VITE_BASE=/ (overriding
# the /ragtime/ project-site default in app/vite.config.ts), app/public/CNAME
# pins the domain in the published artifact, DNS is a grey-cloud CNAME in
# Cloudflare, and the Worker's APP_BASE_URL points at the custom domain.
#
# The legacy single-file app is preserved at /ragtime/legacy.html as a
# transition safety net.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'index.html'
      - '.github/workflows/build-app.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'index.html'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two builds race each other.
concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Custom-domain cutover (2026-06-02): the app now serves from the
        # origin root at https://ragtime.lawfaremedia.org, so the Vite base is
        # `/` rather than the old project-site subpath `/ragtime/`.
        run: npm run build
        env:
          VITE_BASE: /

      - name: Preserve legacy single-file app at /legacy.html
        run: cp ../index.html dist/legacy.html

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  # Deploys the build artifact to GitHub Pages. Only on push to main /
  # manual dispatch — PRs build-validate but never publish.
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Serialize Pages deploys; don't cancel an in-flight publish.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
