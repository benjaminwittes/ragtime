<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- The RAGtime mark at 16px: fluting, the side of a courthouse column rendered densely.
       Four 2px flutes in the brand teal at a 2px pitch, full height, on nothing — a tile
       behind them read as bars in a frame, so there is no tile. Every flute is one width by
       ruling, and every groove is 2px so a tab at any device ratio draws grooves rather than
       a grey block, which is what sank an eleven-rule sketch at this size. The figure's
       other cuts, and the one table they are all drawn from, live in src/components/Mark.tsx.
       This replaces the serif R that stood in while the product had no mark. -->
  <g fill="#006a72">
    <rect x="1" y="0" width="2" height="16"/>
    <rect x="5" y="0" width="2" height="16"/>
    <rect x="9" y="0" width="2" height="16"/>
    <rect x="13" y="0" width="2" height="16"/>
  </g>
</svg>
