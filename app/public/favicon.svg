<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- The wordmark's own first letter on the brand colour: the one artifact that leaves the
       app and sits in a bookmark bar beside the client's site, so it wears the client's colour
       and the serif the wordmark is set in. It is a letter, not a mark — the product has no
       mark yet, by decision — and the corner is the app's 3px. The face is a preference list:
       a favicon renders in whatever serif the machine has, and the letter reads in any of them. -->
  <rect width="48" height="48" rx="3" fill="#006a72"/>
  <text x="24" y="25" text-anchor="middle" dominant-baseline="central"
        font-family="'EB Garamond', Garamond, 'Iowan Old Style', Georgia, 'Times New Roman', serif"
        font-size="36" font-weight="600" fill="#ffffff">R</text>
</svg>
