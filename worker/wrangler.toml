name = "ragtimeproxy"
main = "index.js"
compatibility_date = "2026-05-21"

# Workers Observability — Cloudflare's "Logs" feature. Enabled on the
# live Worker since 2026-05-04; preserved here so a future deploy does
# not silently disable it.
[observability]
enabled = true

# Scheduled cron triggers (dispatched by event.cron in index.js scheduled()):
#   "0 13 * * 1"     weekly, Mon 13:00 UTC (~9am ET) — billing reconciliation
#                    (balance_cents vs sum(ledger), Slack-alert on drift).
#   "*/30 * * * *"   every 30 min — OFF-BOX pipeline liveness check: alerts if
#                    the corpus has stopped receiving new documents (the
#                    pipeline + its watchdog run on Mac2 and can't detect the
#                    box itself dying; this runs on Cloudflare, so it can).
[triggers]
crons = ["0 13 * * 1", "*/30 * * * *"]

# Plain-text variables. Stripe live-mode price IDs, the public Supabase
# project URL, and the frontend app base URL. None of these are sensitive
# — the price IDs are product identifiers, the URLs are public endpoints.
# When the frontend moves off `benjaminwittes.github.io/ragtime` to a
# Lawfare-branded domain, update APP_BASE_URL here.
[vars]
APP_BASE_URL = "https://benjaminwittes.github.io/ragtime"
SUPABASE_URL = "https://aikdbjprndgksibbvcfs.supabase.co"
STRIPE_PRICE_5_USD = "price_1TXoNIJS8oJAjJ8ojuPOv1la"
STRIPE_PRICE_20_USD = "price_1TXoOxJS8oJAjJ8oqgWWK8B5"
STRIPE_PRICE_50_USD = "price_1TXoQUJS8oJAjJ8ovHVaaMG1"
# Corpus Supabase project (the PII-free research-data plane, post DB split).
# The Worker queries it server-side for the /corpus/* endpoints. The key is the
# PUBLISHABLE (anon) key — not a secret: run_query is SELECT-only and the corpus
# holds no PII. Same public-key posture as the frontend's SB_KEY.
CORPUS_SUPABASE_URL = "https://xsqdnuqyqyykkzuiqphr.supabase.co"
CORPUS_SUPABASE_KEY = "sb_publishable_yXX3zE7j7bVfqLj6cy8oeA_allTHvzN"
# Per-account request/min ceiling on the PAID path (in addition to the per-IP
# guard). Bounds request rate independent of IP; the prepaid balance bounds
# total spend. Tune here without a code change. Default in code is 30.
PER_USER_PER_MIN = "30"

# KV namespace for per-IP rate-limit counters and the daily demo quota
# counter. TTL'd entries; see askHandler in index.js for the keys used.
[[kv_namespaces]]
binding = "QUOTA"
id = "06040b3266fb4555a70204af4907b455"

# Secrets are NOT defined here. They are managed out-of-band, either via
#   wrangler secret put <NAME>      (prompts for the value)
# or via the Cloudflare dashboard's "Variables and Secrets" page.
#
# Current secret bindings on the deployed Worker (all required):
#   ANTHROPIC_API_KEY         — Lawfare-org Anthropic API key
#   STRIPE_SECRET_KEY         — Stripe live-mode secret (sk_live_...)
#   STRIPE_WEBHOOK_SECRET     — Stripe live-mode webhook signing secret
#   SUPABASE_SERVICE_ROLE_KEY — Supabase Secret API Key (sb_secret_...)
#
# Optional bindings the code respects (defaults apply if unset):
#   DEMO_PASSWORD             — overrides built-in default
#   BALANCE_FLOOR_CENTS       — default 5
#   MARKUP                    — default 1.35
#   PER_USER_PER_MIN          — paid per-account req/min cap (default 30)
#
# Retired: SUPABASE_JWT_SECRET — was the legacy HS256 JWT verification
#   fallback. The HS256 path was removed from index.js (verifier is ES256-only
#   now), so this secret is no longer read by any code. If it's still bound on
#   the deployed Worker, it can be deleted from the dashboard.
#
# Account ID is NOT hardcoded here. In CI, the deploy Action reads it
# from the `CLOUDFLARE_ACCOUNT_ID` GitHub Actions variable. For local
# wrangler use, either export `CLOUDFLARE_ACCOUNT_ID` in your shell or
# run `wrangler login` first.
